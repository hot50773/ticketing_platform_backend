# Throwaway infrastructure for the automated test suite.
#
# Separate from docker-compose.yaml because the e2e fixtures TRUNCATE every
# table and FLUSHDB on each test: pointed at the developer's stack they would
# destroy real data. Distinct ports and volumes let both run side by side.
# Nothing here is worth keeping - `down -v` and re-migrate.
#
#   docker compose --env-file .env.test -f docker-compose.test.yaml up -d
#   ENV_FILE=.env.test uv run alembic upgrade head
#   docker compose -f docker-compose.test.yaml exec db psql -U postgres -d ticketing_test_db
#
# --env-file is not optional: without it compose reads the default .env and
# builds this stack with the development database name.
#
# `name` is the only place the project is spelled. Containers, volumes and the
# network all derive from it, so there is no second vocabulary to drift out of
# sync - which is how an earlier round left orphaned volumes behind.
name: ticketing-platform-noai-test

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-ticketing_test_db}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
